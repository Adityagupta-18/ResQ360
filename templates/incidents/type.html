{% extends "base_bare.html" %}
{% load static %}

{% block title %}ResQ360 — What happened?{% endblock %}

{% block content %}
<div class="wizard-page">
  <div class="wizard-header">
    <div class="wizard-header__top">
      <a href="/" class="wizard-header__back" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="20" height="20"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <span class="wizard-header__title">What happened?</span>
    </div>
    <div class="form-progress" aria-hidden="true">
      <div class="form-progress__step is-active"></div><div class="form-progress__step"></div><div class="form-progress__step"></div><div class="form-progress__step"></div><div class="form-progress__step"></div>
    </div>
  </div>
  <div class="wizard-body">
    <p class="r-body-secondary" style="margin-bottom:var(--r-space-5);">Choose the option that best describes the emergency. You can add more detail next.</p>
    <div class="select-grid cols-3" data-select-group="emergency-type">
      <button type="button" class="select-card" data-value="accident"><span class="select-card__icon"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 17h1.5l1-4h13l1 4H21M6 13l1.8-5.4A2 2 0 019.7 6h4.6a2 2 0 011.9 1.6L18 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7.5" cy="17.5" r="1.5" stroke="currentColor" stroke-width="1.6"/><circle cx="16.5" cy="17.5" r="1.5" stroke="currentColor" stroke-width="1.6"/></svg></span><span class="select-card__label">Accident</span></button>
      <button type="button" class="select-card" data-value="medical"><span class="select-card__icon"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/></svg></span><span class="select-card__label">Medical Emergency</span></button>
      <button type="button" class="select-card" data-value="fire"><span class="select-card__icon"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 3c1 3-2 4-2 7a2 2 0 004 0c1 1 2 2.3 2 4a4 4 0 11-8 0c0-3.4 2.2-4.7 2-8 1.4.6 2 1.6 2 3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></span><span class="select-card__label">Fire</span></button>
      <button type="button" class="select-card" data-value="crime"><span class="select-card__icon"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 3l7 3v5c0 4.6-3 8.3-7 10-4-1.7-7-5.4-7-10V6l7-3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9.5 12l1.8 1.8L15 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="select-card__label">Crime / Security</span></button>
      <button type="button" class="select-card" data-value="missing"><span class="select-card__icon"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="1.6"/><path d="M5 20c1-3.8 4-6 7-6s6 2.2 7 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M4 4l16 16" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="1 3"/></svg></span><span class="select-card__label">Missing Person</span></button>
      <button type="button" class="select-card" data-value="other"><span class="select-card__icon"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M12 16h.01M12 8v4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span><span class="select-card__label">Blood Bank</span></button>
    </div>
  </div>
  <div class="wizard-footer">
    <a href="{% url 'citizen_location' %}" class="r-btn r-btn-primary r-btn-lg" id="continueBtnType" data-continue-requires="emergency-type" disabled>Continue</a>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/citizen-report.js' %}"></script>
{% endblock %}
